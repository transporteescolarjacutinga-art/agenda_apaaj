<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Transporte Novo Olhar - Agenda TEA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="logo-ong.png">
    <link rel="stylesheet" href="style.css?v=20260814_V5">
</head>
<body class="viewer-mode">

    <!-- Topbar Fixo -->
    <header class="top-header">
        <div class="header-content">
            <div class="brand-group">
                <img src="logo-ong.png" alt="Logo Novo Olhar" class="brand-logo">
                <div class="brand-info">
                    <h1 class="brand-title">Transporte Novo Olhar</h1>
                    <span class="brand-subtitle">Gestão Logística TEA</span>
                </div>
            </div>
            <div class="header-actions">
                <div class="live-clock">
                    <i class="ph ph-clock text-blue"></i>
                    <span id="liveClockDisplay">00:00</span>
                </div>
                <button id="btnImportExcel" type="button" class="action-btn admin-only" title="Importar Planilha Excel"><i class="ph ph-file-arrow-up"></i></button>
                <button id="btnAdminAuth" type="button" class="action-btn" title="Login Coordenador"><i class="ph ph-lock-key"></i></button>
                <button id="btnAdminLogout" type="button" class="action-btn hidden" title="Sair do Modo Coordenador"><i class="ph ph-lock-key-open"></i></button>
            </div>
        </div>
    </header>

    <!-- Control Bar de Data e Filtros -->
    <section class="control-bar">
        <div class="control-content">
            <div class="date-navigator">
                <button id="btnDatePrev" type="button" class="nav-arrow-btn" aria-label="Dia Anterior"><i class="ph ph-caret-left"></i></button>
                <div id="datePickerBox" class="date-picker-box">
                    <input type="date" id="inputDateRef">
                    <div class="date-label-content">
                        <i class="ph ph-calendar-blank"></i>
                        <span id="txtDateLabel">Carregando data...</span>
                    </div>
                </div>
                <button id="btnDateNext" type="button" class="nav-arrow-btn" aria-label="Próximo Dia"><i class="ph ph-caret-right"></i></button>
            </div>

            <div class="filter-strip">
                <div class="search-box">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" id="inputSearchPatient" placeholder="Buscar aluno/paciente...">
                </div>
                <select id="selectProfFilter" class="filter-dropdown">
                    <option value="">Profissionais</option>
                </select>
                <select id="selectShiftFilter" class="filter-dropdown">
                    <option value="">Turnos</option>
                    <option value="Manhã">Manhã</option>
                    <option value="Tarde">Tarde</option>
                </select>
                <select id="selectSchoolFilter" class="filter-dropdown">
                    <option value="">Instituições</option>
                </select>
                <button id="btnResetFilters" type="button" class="reset-filter-btn hidden"><i class="ph ph-funnel-x"></i> Limpar</button>
            </div>
        </div>
    </section>

    <!-- Visualizador Principal -->
    <main class="main-viewport">
        <div class="viewport-content">

            <!-- Aba 1: Agenda Diária -->
            <section id="tabAgenda" class="tab-pane active">
                <div id="scheduleCardsContainer" class="cards-grid"></div>
            </section>

            <!-- Aba 2: Equipe de Campo (Monitoras) -->
            <section id="tabMonitors" class="tab-pane">
                <div class="dashboard-banner purple">
                    <span>Equipe de Campo</span>
                    <h2>Monitoras de Transporte</h2>
                </div>
                <div class="add-monitor-box">
                    <input type="text" id="inputNewMonitor" placeholder="Nome da monitora">
                    <button id="btnAddMonitor" type="button" class="btn-submit"><i class="ph ph-plus-circle"></i> Cadastrar</button>
                </div>
                <div id="monitorsListContainer" class="cards-grid"></div>
            </section>

            <!-- Aba 3: Resumo Operacional (KPIs) -->
            <section id="tabSummary" class="tab-pane">
                <div class="kpi-grid">
                    <button type="button" id="btnKpiTotal" class="kpi-card blue">
                        <span>Total de Atendimentos</span>
                        <strong id="kpiTotal">0</strong>
                    </button>
                    <button type="button" id="btnKpiMorning" class="kpi-card yellow">
                        <span>Turno Manhã</span>
                        <strong id="kpiMorning">0</strong>
                    </button>
                    <button type="button" id="btnKpiAfternoon" class="kpi-card green">
                        <span>Turno Tarde</span>
                        <strong id="kpiAfternoon">0</strong>
                    </button>
                </div>

                <div class="dashboard-banner purple mt-4">
                    <div class="flex-between">
                        <span>Instituições Atendidas</span>
                        <strong id="kpiSchoolsCount" class="badge-count">0</strong>
                    </div>
                    <div id="schoolsListContainer" class="schools-stack mt-2"></div>
                </div>
            </section>

            <!-- Aba 4: Gerador de Relatórios PDF -->
            <section id="tabReports" class="tab-pane">
                <div class="dashboard-banner blue mb-4">
                    <span>Emissão de Documentos</span>
                    <h2>Relatório PDF por Período</h2>
                </div>
                <div class="form-card">
                    <div class="field-group">
                        <label>Data Inicial</label>
                        <input type="date" id="reportStartDate">
                    </div>
                    <div class="field-group">
                        <label>Data Final</label>
                        <input type="date" id="reportEndDate">
                    </div>
                    <button id="btnGenerateReportPdf" type="button" class="btn-submit"><i class="ph ph-file-pdf"></i> Gerar Relatório PDF</button>
                </div>
            </section>

        </div>
    </main>

    <!-- Navegação Inferior Móvel -->
    <nav class="bottom-nav-bar">
        <button id="navTabAgenda" type="button" class="nav-tab-btn active">
            <i class="ph ph-calendar-blank"></i>
            <span>Agenda</span>
        </button>
        <button id="navTabMonitors" type="button" class="nav-tab-btn admin-only">
            <i class="ph ph-users-three"></i>
            <span>Monitoras</span>
        </button>
        <button id="navFabNew" type="button" class="fab-btn admin-only" title="Novo Agendamento">
            <i class="ph ph-plus"></i>
        </button>
        <button id="navTabSummary" type="button" class="nav-tab-btn">
            <i class="ph ph-chart-pie-slice"></i>
            <span>Resumo</span>
        </button>
        <button id="navTabReports" type="button" class="nav-tab-btn admin-only">
            <i class="ph ph-file-pdf"></i>
            <span>Relatórios</span>
        </button>
    </nav>

    <!-- Upload Oculto para Planilhas -->
    <input type="file" id="inputExcelFile" class="hidden" accept=".xlsx,.xls,.csv">

    <!-- Drawer Formulário (Bottom Sheet Simplificado) -->
    <div id="drawerBackdrop" class="backdrop-overlay"></div>
    <aside id="drawerSheet" class="bottom-drawer">
        <div class="drawer-handle"></div>
        <div class="drawer-header">
            <h2 id="drawerTitle">Novo Agendamento</h2>
            <button id="btnCloseDrawer" type="button" class="close-btn"><i class="ph ph-x"></i></button>
        </div>
        <form id="scheduleForm" class="drawer-form">
            <input type="hidden" id="fieldScheduleId">
            <div class="grid-2">
                <div class="field-group">
                    <label>Profissional</label>
                    <input type="text" id="fieldProfessional" required placeholder="Ex: Juliana">
                </div>
                <div class="field-group">
                    <label>Atendimento/Especialidade</label>
                    <input type="text" id="fieldTherapy" required placeholder="Ex: Psicóloga">
                </div>
            </div>
            <div class="field-group">
                <label>Nome do Aluno/Paciente</label>
                <input type="text" id="fieldPatient" required placeholder="Nome completo">
            </div>
            <div class="field-group">
                <label>Data de Início da Série</label>
                <input type="date" id="fieldStartDate" required>
            </div>
            <div class="grid-2">
                <div class="field-group">
                    <label>Horário de Início</label>
                    <input type="time" id="fieldStartTime" required>
                </div>
                <div class="field-group">
                    <label>Horário de Término</label>
                    <input type="time" id="fieldEndTime" required>
                </div>
            </div>
            <div class="grid-2">
                <div class="field-group">
                    <label>Instituição de Ensino</label>
                    <select id="fieldSchool">
                        <option value="">Selecione a escola...</option>
                        <option value="EE FLORIANO SARETTI">EE FLORIANO SARETTI</option>
                        <option value="EE JULIO BRANDAO">EE JULIO BRANDAO</option>
                        <option value="EM PROFESSOR ALFEU DUARTE">EM PROFESSOR ALFEU DUARTE</option>
                        <option value="EE PROFESSORA MARIA ROBERTO DE LIMA">EE PROFESSORA MARIA ROBERTO DE LIMA</option>
                        <option value="ESCOLA MUNICIPAL HILDEBRANDO CLARK">ESCOLA MUNICIPAL HILDEBRANDO CLARK</option>
                        <option value="EM DR MILTON CAMPOS">EM DR MILTON CAMPOS</option>
                        <option value="EM PROFESSORA DONA WILMA PIERONI">EM PROFESSORA DONA WILMA PIERONI</option>
                        <option value="EMEI PROFESSORA HELENA PIERONI SEBUSIANI">EMEI PROFESSORA HELENA PIERONI SEBUSIANI</option>
                        <option value="EM PROFESSOR MICHEL FARHAT">EM PROFESSOR MICHEL FARHAT</option>
                        <option value="C MUN EDUC INF PE SILVERIO NEGRI">C MUN EDUC INF PE SILVERIO NEGRI</option>
                        <option value="CRECHE MUNICIPAL MARIA JOSE LEGATTI RODRIGUES">CRECHE MUNICIPAL MARIA JOSE LEGATTI RODRIGUES</option>
                        <option value="CRECHE MUNICIPAL MONSENHOR VIEIRA">CRECHE MUNICIPAL MONSENHOR VIEIRA</option>
                        <option value="CRECHE MUNICIPAL VEREADOR DOUTOR URBANO LOPES SIQUEIRA">CRECHE MUNICIPAL VEREADOR DOUTOR URBANO LOPES SIQUEIRA</option>
                        <option value="CRECHE MUNICIPAL PROFESSOR DR JOAO ALVES">CRECHE MUNICIPAL PROFESSOR DR JOAO ALVES</option>
                        <option value="EM ANTONIO NICOLETI">EM ANTONIO NICOLETI</option>
                        <option value="CEI-CENTRO DE EDUCACAO INFANTIL JOAO LEGATTI">CEI-CENTRO DE EDUCACAO INFANTIL JOAO LEGATTI</option>
                        <option value="CASA DA CRIANÇA">CASA DA CRIANÇA</option>
                        <option value="APAE">APAE</option>
                        <option value="LAR">LAR</option>
                        <option value="ACAE">ACAE</option>
                        <option value="EBENEZER">EBENEZER</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>Telefone dos Responsáveis</label>
                    <input type="tel" id="fieldPhone" placeholder="11999999999">
                </div>
            </div>
            <div class="field-group">
                <label>Trajeto de Transporte</label>
                <select id="fieldTransport">
                    <option value="Ambos">Entrada e Saída (Ida e Volta)</option>
                    <option value="Entrada">Somente Entrada</option>
                    <option value="Saída">Somente Saída</option>
                </select>
            </div>
            <div class="field-group">
                <label>Observações Adicionais</label>
                <input type="text" id="fieldNotes" placeholder="Ex: CONFIRMADO">
            </div>
            <button type="submit" class="btn-submit">Salvar Agendamento</button>
        </form>
    </aside>

    <!-- Modal Auditoria GPS -->
    <div id="gpsModalBackdrop" class="backdrop-overlay"></div>
    <div id="gpsModal" class="center-modal gps-modal">
        <div class="gps-modal-head">
            <div class="patient-avatar" id="gpsModalAvatar">--</div>
            <div class="patient-meta">
                <h3 id="gpsModalPatientName">Aluno</h3>
                <div class="chip-row">
                    <span id="gpsModalDateLabel" class="date-chip">00/00/0000</span>
                    <span id="gpsModalStatusBadge" class="status-chip">Concluído</span>
                </div>
            </div>
            <button id="btnCloseGpsModal" type="button" class="close-btn"><i class="ph ph-x"></i></button>
        </div>
        <div id="gpsModalTimelineBody" class="gps-modal-body"></div>
        <div class="gps-modal-foot">
            <button id="btnDismissGpsModal" type="button" class="btn-secondary">Fechar Comprovação</button>
        </div>
    </div>

    <!-- Modal Confirmação -->
    <div id="confirmModalBackdrop" class="backdrop-overlay"></div>
    <div id="confirmModal" class="center-modal confirm-modal">
        <div class="confirm-icon"><i class="ph ph-trash"></i></div>
        <h3 id="confirmModalTitle">Confirmar Ação</h3>
        <div id="confirmModalText" class="confirm-text">Deseja prosseguir com esta alteração?</div>
        <div class="grid-2 mt-4">
            <button id="btnConfirmCancel" type="button" class="btn-secondary">Cancelar</button>
            <button id="btnConfirmSubmit" type="button" class="btn-submit">Confirmar</button>
        </div>
    </div>

    <!-- Container Toast Notifications -->
    <div id="toastContainer" class="toast-stack"></div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="initial-data.js?v=20260814_V5"></script>
    <script src="app.js?v=20260814_V5"></script>
</body>
</html>
