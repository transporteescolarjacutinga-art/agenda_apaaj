<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte - Novo Olhar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f6f7fb">
    <link rel="apple-touch-icon" href="logo-ong.png">
    <link rel="stylesheet" href="style.css?v=27">
</head>
<body class="viewer-mode">
    <aside class="app-sidebar">
        <div class="brand-block">
            <img src="logo-ong.png" alt="Novo Olhar">
            <div>
                <h1>Transporte Novo Olhar</h1>
                <p>Agenda 2026</p>
            </div>
        </div>

        <div class="quick-actions">
            <button id="btnAdminLogin" title="Acesso Admin"><i class="ph ph-lock-key"></i></button>
            <button id="btnAdminLogout" class="hidden" title="Sair do Admin"><i class="ph ph-lock-key-open"></i></button>
            <button id="btnManageMonitorsMobile" class="admin-only" title="Monitoras"><i class="ph ph-users-three"></i></button>
            <button id="btnDownloadExcelTemplateMobile" class="admin-only" title="Modelo Excel"><i class="ph ph-file-xls"></i></button>
            <button id="btnImportExcelMobile" class="admin-only" title="Importar"><i class="ph ph-upload-simple"></i></button>
            <button id="btnReportMobile" class="admin-only" title="Relatório PDF"><i class="ph ph-file-pdf"></i></button>
        </div>

        <nav class="desktop-nav">
            <a href="#" id="navAgenda"><i class="ph ph-squares-four"></i> Visão Geral</a>
            <button id="btnManageMonitors" class="admin-only"><i class="ph ph-users-three"></i> Monitoras</button>
            <button id="btnDownloadExcelTemplate" class="admin-only"><i class="ph ph-file-xls"></i> Modelo Excel</button>
            <button id="btnImportExcel" class="admin-only"><i class="ph ph-upload-simple"></i> Importar Planilha</button>
            <button id="btnReport" class="admin-only"><i class="ph ph-file-pdf"></i> Relatório PDF</button>
        </nav>

        <button id="btnNewAppointment" class="primary-action admin-only"><i class="ph ph-plus-circle"></i> Novo atendimento</button>
    </aside>

    <main id="mainContainer" class="app-main">
        <header class="topbar">
            <div class="today-bar">
                <div class="clock-box"><i class="ph ph-clock"></i><span id="liveClock">--:--</span></div>
                <div class="count-box"><span id="appointmentCountMobile">0</span> atendimentos</div>
            </div>

            <section class="filters-panel" aria-label="Filtros">
                <div class="date-control">
                    <button id="btnPrevDay" type="button" aria-label="Dia anterior"><i class="ph ph-caret-left"></i></button>
                    <input type="date" id="filterDataRef">
                    <button id="btnNextDay" type="button" aria-label="Próximo dia"><i class="ph ph-caret-right"></i></button>
                </div>
                <label class="search-control">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" id="filterPaciente" placeholder="Buscar paciente">
                </label>
                <select id="filterProfissional">
                    <option value="">Profissionais</option>
                </select>
                <select id="filterTurno">
                    <option value="">Turnos</option>
                    <option value="Manhã">Manhã</option>
                    <option value="Tarde">Tarde</option>
                </select>
                <select id="filterEscola">
                    <option value="">Instituições</option>
                </select>
                <button id="btnClearFilters" class="clear-filters hidden" type="button"><i class="ph ph-funnel-x"></i> Limpar filtros</button>
            </section>

            <div class="desktop-count"><span id="appointmentCount">0</span> agendamentos</div>
        </header>

        <section id="dashboardPanel" class="dashboard-panel">
            <button type="button" id="dashTotalCard" class="metric-card">
                <span>Atendimentos</span>
                <strong id="dashTotal">0</strong>
                <small id="dashDateLabel">Hoje</small>
            </button>
            <button type="button" id="dashMorningCard" class="metric-card">
                <span>Manhã</span>
                <strong id="dashMorning">0</strong>
                <small>Filtrar</small>
            </button>
            <button type="button" id="dashAfternoonCard" class="metric-card">
                <span>Tarde</span>
                <strong id="dashAfternoon">0</strong>
                <small>Filtrar</small>
            </button>
            <div class="summary-card">
                <div class="summary-title">Instituições <strong id="dashSchoolsCount">0</strong></div>
                <div id="dashSchools" class="summary-list"><div>Sem dados</div></div>
            </div>
            <div class="summary-card">
                <div class="summary-title">Monitoras <strong id="dashMonitorsCount">0</strong></div>
                <div id="dashMonitors" class="summary-list"></div>
            </div>
        </section>

        <section id="agendaBoard" class="agenda-board">
            <div id="agendaList" class="agenda-list"></div>
        </section>
    </main>

    <button id="btnNewAppointmentMobile" class="floating-new admin-only" type="button"><i class="ph ph-plus"></i></button>
    <input type="file" id="excelImportInput" class="hidden" accept=".xlsx,.xls,.csv">

    <div id="drawerOverlay" class="overlay hidden-layer"></div>
    <aside id="drawer" class="drawer">
        <div class="drawer-head">
            <h2 id="drawerTitle">Novo atendimento</h2>
            <button id="closeDrawer" type="button"><i class="ph ph-x"></i></button>
        </div>
        <form id="appointmentForm" class="drawer-form">
            <input type="hidden" id="formId">
            <label id="editScopeGroup" class="edit-scope hidden">Aplicar edição
                <select id="editScope">
                    <option value="day">Apenas este atendimento do dia</option>
                    <option value="patient">Todos os atendimentos deste paciente</option>
                </select>
            </label>
            <div class="form-grid">
                <label>Profissional<input type="text" id="formProfissional" required placeholder="Ex: Juliana"></label>
                <label>Atendimento<input type="text" id="formTipo" required placeholder="Ex: Psicóloga"></label>
            </div>
            <label>Paciente<input type="text" id="formPaciente" required placeholder="Nome completo"></label>
            <label>Data início<input type="date" id="formDataInicio" required></label>
            <div class="form-grid">
                <label>Início<input type="time" id="formInicio" required></label>
                <label>Término<input type="time" id="formTermino" required></label>
            </div>
            <div class="form-grid">
                <label>Instituição
                    <select id="formEscola">
                        <option value="">Selecione...</option>
                        <option value="EE FLORIANO SARETTI">EE FLORIANO SARETTI</option>
                        <option value="EE JULIO BRANDAO">EE JULIO BRANDAO</option>
                        <option value="EM PROFESSOR ALFEU DUARTE">EM PROFESSOR ALFEU DUARTE</option>
                        <option value="EE PROFESSORA MARIA ROBERTO DE LIMA">EE PROFESSORA MARIA ROBERTO DE LIMA</option>
                        <option value="ESCOLA MUNICIPAL HILDEBRANDO CLARK">ESCOLA MUNICIPAL HILDEBRANDO CLARK</option>
                        <option value="EM DR MILTON CAMPOS">EM DR MILTON CAMPOS</option>
                        <option value="EM PROFESSORA DONA WILMA PIERONI">EM PROFESSORA DONA WILMA PIERONI</option>
                        <option value="EMEI PROFESSORA HELENA PIERONI SEBUSIANI">EMEI PROFESSORA HELENA PIERONI SEBUSIANI</option>
                        <option value="EM PROFESSOR MICHEL FARHAT">EM PROFESSOR MICHEL FARHAT</option>
                        <option value="C MUN EDUC INF PE SILVERIO NEGRI">C MUN EDUC INF PE SILVERIO NEGRI</option>
                        <option value="CRECHE MUNICIPAL MARIA JOSE LEGATTI RODRIGUES">CRECHE MUNICIPAL MARIA JOSE LEGATTI RODRIGUES</option>
                        <option value="CRECHE MUNICIPAL MONSENHOR VIEIRA">CRECHE MUNICIPAL MONSENHOR VIEIRA</option>
                        <option value="CRECHE MUNICIPAL VEREADOR DOUTOR URBANO LOPES SIQUEIRA">CRECHE MUNICIPAL VEREADOR DOUTOR URBANO LOPES SIQUEIRA</option>
                        <option value="CRECHE MUNICIPAL PROFESSOR DR JOAO ALVES">CRECHE MUNICIPAL PROFESSOR DR JOAO ALVES</option>
                        <option value="EM ANTONIO NICOLETI">EM ANTONIO NICOLETI</option>
                        <option value="CEI-CENTRO DE EDUCACAO INFANTIL JOAO LEGATTI">CEI-CENTRO DE EDUCACAO INFANTIL JOAO LEGATTI</option>
                        <option value="CASA DA CRIANÇA">CASA DA CRIANÇA</option>
                        <option value="APAE">APAE</option>
                        <option value="LAR">LAR</option>
                        <option value="ACAE">ACAE</option>
                    </select>
                </label>
                <label>Telefone<input type="tel" id="formTelefone" placeholder="11999999999"></label>
            </div>
            <label>Trajeto
                <select id="formTransporte">
                    <option value="Ambos">Entrada e Saída</option>
                    <option value="Entrada">Somente Entrada</option>
                    <option value="Saída">Somente Saída</option>
                </select>
            </label>
            <label>Observações<input type="text" id="formObs" placeholder="Ex: CONFIRMADO"></label>
            <button type="submit" class="save-button">Salvar</button>
        </form>
    </aside>

    <div id="monitorsModalOverlay" class="modal-overlay">
        <div id="monitorsModal" class="modal-card">
            <div class="modal-head">
                <h3>Monitoras</h3>
                <button id="btnCloseMonitors" type="button"><i class="ph ph-x"></i></button>
            </div>
            <div class="inline-form">
                <input type="text" id="newMonitorName" placeholder="Nome da monitora">
                <button id="btnAddMonitor" type="button"><i class="ph ph-plus-circle"></i> Add</button>
            </div>
            <div id="monitorsList" class="monitors-list"></div>
            <button id="btnSaveMonitors" type="button" class="save-button">Concluído</button>
        </div>
    </div>

    <div id="confirmModalOverlay" class="modal-overlay">
        <div id="confirmModal" class="modal-card confirm-card">
            <div id="confirmModalIcon" class="confirm-icon"><i class="ph ph-question"></i></div>
            <h3 id="confirmModalTitle">Confirmar</h3>
            <p id="confirmModalMessage">Tem certeza que deseja realizar esta ação?</p>
            <div class="confirm-actions">
                <button id="btnConfirmCancel" type="button">Cancelar</button>
                <button id="btnConfirmOk" type="button">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="reportModalOverlay" class="modal-overlay">
        <div id="reportModal" class="modal-card">
            <div class="modal-head">
                <h3>Relatório de atendimentos</h3>
                <button id="btnCloseReport" type="button"><i class="ph ph-x"></i></button>
            </div>
            <div class="report-form">
                <label>Data inicial<input type="date" id="reportStartDate"></label>
                <label>Data final<input type="date" id="reportEndDate"></label>
                <button id="btnGenerateReport" type="button" class="save-button"><i class="ph ph-file-pdf"></i> Gerar PDF</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="app.js?v=27"></script>
</body>
</html>
